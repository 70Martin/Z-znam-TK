<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#4f46e5">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Záznam krevního tlaku</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f3f4f6;
            --surface: #ffffff;
            --text: #1f2937;
            --border: #e5e7eb;
            --danger: #ef4444;
            --warning: #f59e0b;
            --low: #3b82f6;
            --success: #10b981;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        h1, h2 {
            color: var(--text);
            margin-bottom: 20px;
        }

        .card {
            background: var(--surface);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #4b5563;
        }

        input, select {
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--primary);
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            color: white;
            font-size: 0.9rem;
        }

        button:hover {
            opacity: 0.9;
        }

        .btn-primary { background-color: var(--primary); }
        .btn-danger { background-color: var(--danger); }
        .btn-success { background-color: var(--success); }
        .btn-print { background-color: #6366f1; }
        .btn-import { background-color: #6b7280; }

        .file-upload-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .file-upload-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--surface);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        th, td {
            padding: 14px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: #f8fafc;
            font-weight: 600;
            color: #4b5563;
        }

        tr:hover {
            background-color: #f8fafc;
        }

        .action-cell {
            display: flex;
            gap: 8px;
        }

        /* Barevné odlišení hodnot */
        .val-danger { color: var(--danger); font-weight: bold; }
        .val-warning { color: var(--warning); font-weight: bold; }
        .val-low { color: var(--low); font-weight: bold; }

        /* Styly pro tisk a PDF */
        @media print {
            body { 
                background: white; 
                padding: 0;
            }
            .card, .actions, .action-cell, th:last-child, td:last-child { 
                display: none !important; 
            }
            table { 
                box-shadow: none; 
                border: 1px solid black; 
            }
            th, td { 
                border: 1px solid black; 
                padding: 8px;
            }
            h1 {
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Záznam krevního tlaku</h1>
        
        <div class="card">
            <form id="pressureForm">
                <div class="form-grid">
                    <div class="input-group">
                        <label for="date">Datum:</label>
                        <input type="date" id="date" name="date" required>
                    </div>
                    <div class="input-group">
                        <label for="time">Čas:</label>
                        <select id="time" name="time" required>
                            <option value="ráno">Ráno</option>
                            <option value="večer">Večer</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="sTK">sTK (Horní):</label>
                        <input type="number" id="sTK" name="sTK" min="50" max="250" placeholder="např. 120" required>
                    </div>
                    <div class="input-group">
                        <label for="dTK">dTK (Spodní):</label>
                        <input type="number" id="dTK" name="dTK" min="30" max="150" placeholder="např. 80" required>
                    </div>
                    <div class="input-group">
                        <label for="TF">Tep (TF):</label>
                        <input type="number" id="TF" name="TF" min="30" max="200" placeholder="např. 70" required>
                    </div>
                </div>
                
                <div class="actions">
                    <button type="button" class="btn-primary" onclick="addOrUpdateEntry()">Přidat / Upravit záznam</button>
                    <button type="button" class="btn-success" onclick="saveToFile()">Uložit zálohu (JSON)</button>
                    
                    <div class="file-upload-wrapper">
                        <button type="button" class="btn-import">Nahrát zálohu</button>
                        <input type="file" id="fileInput" accept=".json" onchange="loadFromFile(event)">
                    </div>
                    
                    <button type="button" class="btn-print" onclick="window.print()">Tisk / Uložit jako PDF</button>
                </div>
            </form>
        </div>

        <h2>Historie měření</h2>
        <table id="entriesTable">
            <thead>
                <tr>
                    <th>Datum</th>
                    <th>Čas</th>
                    <th>sTK</th>
                    <th>dTK</th>
                    <th>Tep</th>
                    <th class="action-cell">Akce</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>

    <script>
        let currentEditIndex = null;
        let entries = JSON.parse(localStorage.getItem("bloodPressureEntries")) || [];

        // 1. Automatické vkládání času a data
        function setDefaultDateTime() {
            const now = new Date();
            // Nastavení dnešního data
            document.getElementById("date").value = now.toISOString().split('T')[0];
            // Automatický výběr ráno/večer podle aktuální hodiny (do 14:00 ráno, jinak večer)
            const hour = now.getHours();
            document.getElementById("time").value = (hour < 14) ? "ráno" : "večer";
        }

        // 4. Analýza a obarvení krajních hodnot tlaku
        function getPressureColorClass(sTK, dTK) {
            let sClass = '';
            let dClass = '';

            // Hodnocení sTK (horní)
            if (sTK >= 140) sClass = 'val-danger'; // Vysoký
            else if (sTK >= 130) sClass = 'val-warning'; // Zvýšený
            else if (sTK < 90) sClass = 'val-low'; // Nízký

            // Hodnocení dTK (spodní)
            if (dTK >= 90) dClass = 'val-danger'; // Vysoký
            else if (dTK >= 85) dClass = 'val-warning'; // Zvýšený
            else if (dTK < 60) dClass = 'val-low'; // Nízký

            return { sClass, dClass };
        }

        function loadEntries() {
            const tableBody = document.getElementById("entriesTable").getElementsByTagName("tbody")[0];
            tableBody.innerHTML = "";
            
            entries.forEach((entry, index) => {
                const row = tableBody.insertRow();
                const colors = getPressureColorClass(entry.sTK, entry.dTK);

                row.insertCell(0).textContent = new Date(entry.date).toLocaleDateString('cs-CZ');
                row.insertCell(1).textContent = entry.time;
                
                const sTKCell = row.insertCell(2);
                sTKCell.textContent = entry.sTK;
                if(colors.sClass) sTKCell.classList.add(colors.sClass);

                const dTKCell = row.insertCell(3);
                dTKCell.textContent = entry.dTK;
                if(colors.dClass) dTKCell.classList.add(colors.dClass);

                row.insertCell(4).textContent = entry.TF;
                
                const actions = row.insertCell(5);
                actions.className = "action-cell";
                actions.innerHTML = `
                    <button class="btn-primary" style="padding: 6px 10px; font-size: 0.8rem;" onclick="editEntry(${index})">Upravit</button>
                    <button class="btn-danger" style="padding: 6px 10px; font-size: 0.8rem;" onclick="deleteEntry(${index})">Smazat</button>
                `;
            });
        }

        function addOrUpdateEntry() {
            const date = document.getElementById("date").value;
            const time = document.getElementById("time").value;
            const sTK = parseInt(document.getElementById("sTK").value);
            const dTK = parseInt(document.getElementById("dTK").value);
            const TF = parseInt(document.getElementById("TF").value);

            if (!date || !time || isNaN(sTK) || isNaN(dTK) || isNaN(TF)) {
                alert("Vyplňte všechna pole platnými čísly!");
                return;
            }

            const entry = { date, time, sTK, dTK, TF };

            if (currentEditIndex !== null) {
                entries[currentEditIndex] = entry;
                currentEditIndex = null;
            } else {
                entries.push(entry);
            }

            // 2. Automatické řazení podle data (od nejnovějšího po nejstarší)
            entries.sort((a, b) => new Date(b.date) - new Date(a.date));

            localStorage.setItem("bloodPressureEntries", JSON.stringify(entries));
            loadEntries();
            document.getElementById("pressureForm").reset();
            setDefaultDateTime(); // Vrácení defaultního data po odeslání
        }

        function editEntry(index) {
            currentEditIndex = index;
            const entry = entries[index];
            document.getElementById("date").value = entry.date;
            document.getElementById("time").value = entry.time;
            document.getElementById("sTK").value = entry.sTK;
            document.getElementById("dTK").value = entry.dTK;
            document.getElementById("TF").value = entry.TF;
            
            // Scroll nahoru k formuláři
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteEntry(index) {
            if(confirm("Opravdu chcete tento záznam smazat?")) {
                entries.splice(index, 1);
                localStorage.setItem("bloodPressureEntries", JSON.stringify(entries));
                loadEntries();
            }
        }

        function saveToFile() {
            // Data jsou již seřazena díky funkci v addOrUpdateEntry
            const blob = new Blob([JSON.stringify(entries, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `krevni_tlak_zaloha_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function loadFromFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const newEntries = JSON.parse(e.target.result);
                    // Spojení a odstranění případných duplicit by bylo složitější, 
                    // pro teď spojíme a znovu seřadíme.
                    entries = entries.concat(newEntries);
                    entries.sort((a, b) => new Date(b.date) - new Date(a.date));
                    
                    localStorage.setItem("bloodPressureEntries", JSON.stringify(entries));
                    loadEntries();
                    alert("Data byla úspěšně nahrána.");
                } catch (error) {
                    alert("Soubor není validní JSON.");
                }
            };
            reader.readAsText(file);
        }

        // Inicializace při načtení stránky
        setDefaultDateTime();
        loadEntries();
    </script>
</body>
</html>
